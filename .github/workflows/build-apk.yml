name: Build APK (zh-CN)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version && java -version

      # NDK 28 的 glslc 会让 llama.cpp 的 Vulkan 着色器编译失败，固定到 27
      - name: Install NDK 27
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
          ls "$ANDROID_HOME/ndk"

      # android/app/build.gradle.kts 在 release 构建时强制要求 keystore，
      # 这里生成一个临时签名（每次构建都会变，如需固定签名改成 secrets 注入）
      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias privatelm \
            -storepass privatelm123 -keypass privatelm123 \
            -dname "CN=PrivateLM, OU=Dev, O=PrivateLM, L=City, ST=State, C=CN"
          printf 'storeFile=release.jks\nstorePassword=privatelm123\nkeyAlias=privatelm\nkeyPassword=privatelm123\n' > android/key.properties

      - name: Pub get
        run: flutter pub get

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64


      # 把中文 libapp.so 推到 dist 分支，方便只取这 10MB 而不是整个 APK
      - name: Publish libapp.so to dist branch
        run: |
          mkdir -p dist
          unzip -o -q build/app/outputs/flutter-apk/app-release.apk lib/arm64-v8a/libapp.so -d dist
          mv dist/lib/arm64-v8a/libapp.so dist/libapp.so
          git config user.email "ci@local"
          git config user.name "ci"
          git checkout --orphan dist-tmp
          git rm -rf --cached . > /dev/null
          git add -f dist/libapp.so
          git commit -q -m "dist: libapp.so $(date -u +%FT%TZ)"
          git push -f origin HEAD:dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-zh-CN
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
